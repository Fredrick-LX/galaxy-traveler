  <polygon points="32,8 48,14 46,36 32,44" fill="#CCCCCC"/>
  <!-- 装甲层 -->
  <line x1="20" y1="24" x2="44" y2="24" stroke="#666666" stroke-width="2"/>
  <line x1="20" y1="32" x2="44" y2="32" stroke="#666666" stroke-width="2"/>
  <!-- 舰桥 -->
  <rect x="24" y="18" width="16" height="12" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="26" y="20" width="12" height="8" fill="#EEEEEE"/>
  <!-- 侧翼炮塔 -->
  <rect x="12" y="26" width="6" height="6" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="46" y="26" width="6" height="6" fill="#666666" stroke="#000000" stroke-width="2"/>
  <circle cx="15" cy="29" r="2" fill="#333333"/>
  <circle cx="49" cy="29" r="2" fill="#333333"/>
  <!-- 主炮塔 -->
  <rect x="26" y="32" width="12" height="8" fill="#333333" stroke="#000000" stroke-width="2"/>
  <rect x="30" y="28" width="4" height="4" fill="#666666" stroke="#000000" stroke-width="1"/>
  <line x1="32" y1="28" x2="32" y2="24" stroke="#666666" stroke-width="2"/>
  <!-- 推进器组 -->
  <polygon points="24,48 32,52 40,48" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="26" y="52" width="4" height="4" fill="#333333"/>
  <rect x="34" y="52" width="4" height="4" fill="#333333"/>
</svg>

