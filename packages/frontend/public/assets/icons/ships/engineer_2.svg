  <circle cx="20" cy="32" r="3" fill="#333333" stroke="#000000" stroke-width="1"/>
  <circle cx="44" cy="32" r="3" fill="#333333" stroke="#000000" stroke-width="1"/>
  <line x1="16" y1="32" x2="14" y2="32" stroke="#333333" stroke-width="2"/>
  <line x1="48" y1="32" x2="50" y2="32" stroke="#333333" stroke-width="2"/>
