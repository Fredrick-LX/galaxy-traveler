  <line x1="36" y1="20" x2="40" y2="16" stroke="#666666" stroke-width="2"/>
  <circle cx="24" cy="16" r="2" fill="#333333" stroke="#000000" stroke-width="1"/>
  <circle cx="40" cy="16" r="2" fill="#333333" stroke="#000000" stroke-width="1"/>
