<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 工程船 等级1 - 小型工程船 -->
  <rect x="24" y="16" width="16" height="28" fill="#999999" stroke="#000000" stroke-width="2"/>
  <rect x="26" y="18" width="12" height="24" fill="#CCCCCC"/>
  <!-- 工具臂 -->
  <rect x="20" y="26" width="4" height="8" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="40" y="26" width="4" height="8" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="18" y="32" width="4" height="2" fill="#333333"/>
  <rect x="42" y="32" width="4" height="2" fill="#333333"/>
  <!-- 驾驶舱 -->
  <rect x="28" y="20" width="8" height="6" fill="#EEEEEE" stroke="#000000" stroke-width="1"/>
  <!-- 货舱 -->
  <rect x="28" y="30" width="8" height="10" fill="#666666" stroke="#000000" stroke-width="1"/>
  <line x1="28" y1="34" x2="36" y2="34" stroke="#333333" stroke-width="1"/>
  <!-- 推进器 -->
  <rect x="28" y="44" width="8" height="6" fill="#666666" stroke="#000000" stroke-width="1"/>
  <line x1="30" y1="50" x2="30" y2="54" stroke="#999999" stroke-width="1"/>
  <line x1="34" y1="50" x2="34" y2="54" stroke="#999999" stroke-width="1"/>
  <!-- 等级标记 -->
  <text x="32" y="38" font-size="8" text-anchor="middle" fill="#EEEEEE" font-weight="bold">I</text>
</svg>

