  <circle cx="24" cy="32" r="6" fill="#CCCCCC"/>
  <circle cx="40" cy="32" r="9" fill="#EEEEEE" stroke="#000000" stroke-width="2"/>
  <circle cx="40" cy="32" r="6" fill="#CCCCCC"/>
