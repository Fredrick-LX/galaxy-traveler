<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 船坞 - 大型吊车 -->
  <rect x="10" y="40" width="44" height="14" fill="#999999" stroke="#000000" stroke-width="2"/>
  <rect x="14" y="44" width="36" height="6" fill="#CCCCCC"/>
  <!-- 吊车支架 -->
  <rect x="14" y="12" width="6" height="30" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="44" y="12" width="6" height="30" fill="#666666" stroke="#000000" stroke-width="2"/>
  <!-- 吊臂 -->
  <rect x="14" y="12" width="36" height="6" fill="#999999" stroke="#000000" stroke-width="2"/>
  <!-- 吊钩 -->
  <line x1="32" y1="18" x2="32" y2="28" stroke="#333333" stroke-width="2"/>
  <path d="M 28,28 L 32,30 L 36,28" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- 船体轮廓 -->
  <path d="M 24,32 L 28,36 L 36,36 L 40,32" fill="#666666" stroke="#000000" stroke-width="2"/>
  <!-- 窗户 -->
  <rect x="18" y="46" width="4" height="4" fill="#333333"/>
  <rect x="42" y="46" width="4" height="4" fill="#333333"/>
</svg>

