<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 结构建造器 - 3D打印机 -->
  <rect x="16" y="44" width="32" height="10" fill="#999999" stroke="#000000" stroke-width="2"/>
  <!-- 框架 -->
  <rect x="18" y="14" width="4" height="32" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="42" y="14" width="4" height="32" fill="#666666" stroke="#000000" stroke-width="2"/>
  <rect x="18" y="14" width="28" height="4" fill="#666666" stroke="#000000" stroke-width="2"/>
  <!-- 打印头 -->
  <rect x="26" y="20" width="12" height="8" fill="#CCCCCC" stroke="#000000" stroke-width="2"/>
  <polygon points="28,28 36,28 34,32 30,32" fill="#999999" stroke="#000000" stroke-width="2"/>
  <!-- 打印光束 -->
  <line x1="30" y1="32" x2="28" y2="38" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="32" y1="32" x2="32" y2="38" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="34" y1="32" x2="36" y2="38" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- 正在建造的物体 -->
  <rect x="28" y="38" width="8" height="6" fill="#666666" stroke="#000000" stroke-width="1" stroke-dasharray="1,1"/>
  <!-- 控制面板 -->
  <rect x="22" y="24" width="3" height="3" fill="#333333"/>
</svg>

