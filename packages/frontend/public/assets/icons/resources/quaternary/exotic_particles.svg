  <path d="M 32,32 Q 20,48 32,52 Q 44,48 32,32" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- 粒子 -->
  <circle cx="52" cy="32" r="2" fill="#666666"/>
  <circle cx="12" cy="32" r="2" fill="#666666"/>
  <circle cx="32" cy="12" r="2" fill="#999999"/>
  <circle cx="32" cy="52" r="2" fill="#999999"/>
